<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Login | BoschFlow</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

background:#f5f5f5;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:Arial;

}

.card{

width:420px;

border:none;

border-radius:18px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.logo{

font-size:34px;

font-weight:bold;

color:#0d6efd;

}

</style>

</head>

<body>

<div class="card">

<div class="card-body p-5">

<div class="text-center mb-4">

<div class="logo">

BoschFlow

</div>

<p class="text-muted">

Sistema de Gestão de Estoque

</p>

</div>

{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for categoria,mensagem in messages %}

<div class="alert alert-{{categoria}}">

{{mensagem}}

</div>

{% endfor %}

{% endif %}

{% endwith %}

<form method="POST">

<div class="mb-3">

<label>E-mail</label>

<input
type="email"
class="form-control"
name="email"
required>

</div>

<div class="mb-4">

<label>Senha</label>

<input
type="password"
class="form-control"
name="senha"
required>

</div>

<button
class="btn btn-primary w-100">

Entrar

</button>

</form>

</div>

</div>

</body>

</html>
